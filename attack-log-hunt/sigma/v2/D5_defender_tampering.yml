title: Microsoft Defender Settings Changed From the Command Line
id: ac5c23bb-fb87-40b8-8b6b-e49b6d021113
status: experimental
description: |
  PowerShell used to turn off Defender real-time protection or add scan exclusions.
  Attackers do this so their tools are not caught.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: Andy (Anh Truong) Nguyen
date: 2026-11-26
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cli:
    CommandLine|contains:
      - 'DisableRealtimeMonitoring'
      - 'Add-MpPreference -ExclusionPath'
      - 'Add-MpPreference -ExclusionProcess'
  condition: all of selection_*
falsepositives:
  - Administrators tuning Defender for line-of-business software
level: high
